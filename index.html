<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#003B6A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TBPG Security">
  <link rel="manifest" href="/security/manifest.json">
  <link rel="apple-touch-icon" href="/security/icon-192.png">
  <title>TBPG Security Portal</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:#f3f8fc;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif
    }
    #appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #pushBtn{
      position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:99999;
      border:0;border-radius:999px;padding:12px 16px;background:#003B6A;color:#fff;
      font-weight:800;box-shadow:0 10px 28px rgba(0,59,106,.28);display:none
    }
    #installTip{
      position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
      z-index:100000;background:#fff;color:#17384c;border:1px solid #cfe0ea;border-radius:16px;
      padding:13px 42px 13px 14px;box-shadow:0 12px 34px rgba(0,59,106,.16);
      font-size:13px;line-height:1.45;display:none
    }
    #installTip b{color:#003B6A}
    #tipClose{
      position:absolute;right:8px;top:7px;width:30px;height:30px;border:0;border-radius:10px;
      background:#eef4f8;color:#31596e;font-size:19px
    }
    #status{
      position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);
      z-index:100001;background:rgba(0,59,106,.94);color:#fff;padding:7px 11px;border-radius:999px;
      font-size:11px;font-weight:700;display:none
    }
  </style>
</head>
<body>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbx5GzuXdyc7W_OJNSzE6Mhshqvd6TmhuL580_NdwuCbSOIUVnw_QPVzrSTEDIvo6sf3Gg/exec"
    allow="clipboard-read; clipboard-write; camera; microphone">
  </iframe>

  <button id="pushBtn" type="button">🔔 Bildirimleri Aç</button>

  <div id="installTip">
    <button id="tipClose" type="button">×</button>
    <b>iPhone:</b> Bildirim alabilmek için önce bu sayfayı <b>Ana Ekrana Ekle</b>.
    Daha sonra ana ekrandaki <b>TBPG Security</b> ikonundan aç ve
    <b>“Bildirimleri Aç”</b> butonuna dokun.
  </div>

  <div id="status"></div>

<script>
const ONESIGNAL_APP_ID='42b7220b-661b-45f3-907c-e54b9ea99aec';
const SESSION_STORAGE_KEY='guv_security_portal_session_v4016';
const SESSION_MAX_MS=14*24*60*60*1000;

let currentEducationId='';
let oneSignalApi=null;

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone===true;
}
function showStatus(text,ms=2500){
  const e=document.getElementById('status');
  e.textContent=text;e.style.display='block';
  clearTimeout(showStatus.timer);
  showStatus.timer=setTimeout(()=>{e.style.display='none'},ms);
}
function maybeShowIOSInstallTip(){
  if(isIOS()&&!isStandalone()&&localStorage.getItem('guv_install_tip_closed')!=='1'){
    document.getElementById('installTip').style.display='block';
  }
}
document.getElementById('tipClose').addEventListener('click',()=>{
  document.getElementById('installTip').style.display='none';
  localStorage.setItem('guv_install_tip_closed','1');
});

/* ==========================================================
   V4.0.16 — STABLE PWA SESSION STORAGE
   Apps Script iframe host can change on mobile. Therefore the
   validated 14-day session token is persisted on this stable
   GitHub Pages origin and returned to the iframe on startup.
   ========================================================== */
function readPortalSession(){
  try{
    const raw=localStorage.getItem(SESSION_STORAGE_KEY);
    if(!raw)return null;
    const box=JSON.parse(raw);
    const token=String(box?.token||'').trim();
    const expiresAt=Number(box?.expiresAt||0);
    if(!token || !expiresAt || expiresAt<=Date.now()){
      localStorage.removeItem(SESSION_STORAGE_KEY);
      return null;
    }
    return {token,expiresAt};
  }catch(e){
    try{localStorage.removeItem(SESSION_STORAGE_KEY)}catch(_){}
    return null;
  }
}

function savePortalSession(token,expiresAt){
  token=String(token||'').trim();
  expiresAt=Number(expiresAt||0);
  if(!token)return;
  // Sunucunun gönderdiği süreden daha uzun saklama yapılmaz.
  const maxExpiry=Date.now()+SESSION_MAX_MS;
  if(!expiresAt || expiresAt>maxExpiry)expiresAt=maxExpiry;
  if(expiresAt<=Date.now())return;
  try{
    localStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify({
      token,expiresAt,savedAt:Date.now()
    }));
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().catch(()=>{});
    }
  }catch(e){}
}

function clearPortalSession(){
  try{localStorage.removeItem(SESSION_STORAGE_KEY)}catch(e){}
}

function isTrustedAppsScriptOrigin(origin){
  origin=String(origin||'');
  return origin==='https://script.google.com' ||
    /^https:\/\/[a-z0-9.-]*script\.googleusercontent\.com$/i.test(origin);
}

function postSessionToFrame(requestId){
  const frame=document.getElementById('appFrame');
  if(!frame || !frame.contentWindow)return;
  const session=readPortalSession();
  frame.contentWindow.postMessage({
    type:'GUV_SECURITY_SESSION_RESPONSE',
    requestId:String(requestId||''),
    token:session?.token||'',
    expiresAt:session?.expiresAt||0
  },'*');
}

/* ==========================================================
   ONESIGNAL
   ========================================================== */
window.OneSignalDeferred=window.OneSignalDeferred||[];
window.OneSignalDeferred.push(async function(OneSignal){
  oneSignalApi=OneSignal;
  try{
    await OneSignal.init({
      appId:ONESIGNAL_APP_ID,
      serviceWorkerPath:'/security/OneSignalSDKWorker.js',
      serviceWorkerParam:{scope:'/security/'},
      autoResubscribe:true
    });
  }catch(error){
    console.error('OneSignal init error:',error);
    showStatus('Bildirim sistemi başlatılamadı',3500);
    return;
  }

  if(currentEducationId){
    try{await OneSignal.login(currentEducationId)}
    catch(error){console.error('OneSignal login error:',error)}
  }

  const btn=document.getElementById('pushBtn');
  const supported=('Notification' in window)&&('serviceWorker' in navigator);
  if(!supported){btn.style.display='none';return}

  if(Notification.permission!=='granted'){
    if(!isIOS()||isStandalone())btn.style.display='block';
  }else btn.style.display='none';

  btn.addEventListener('click',async()=>{
    try{
      if(isIOS()&&!isStandalone()){
        maybeShowIOSInstallTip();
        showStatus('Önce Ana Ekrana ekleyin');
        return;
      }
      if(currentEducationId)await OneSignal.login(currentEducationId);
      await OneSignal.Notifications.requestPermission();
      if(Notification.permission==='granted'){
        btn.style.display='none';
        showStatus('Bildirimler açıldı ✓');
      }else showStatus('Bildirim izni verilmedi',3000);
    }catch(error){
      console.error('Notification permission error:',error);
      showStatus('Bildirim izni açılamadı',3500);
    }
  });
});

/* ==========================================================
   APPS SCRIPT ↔ PWA MESSAGE BRIDGE
   ========================================================== */
window.addEventListener('message',async function(event){
  const frame=document.getElementById('appFrame');

  // Only accept messages from our own iframe.
  if(!frame || event.source!==frame.contentWindow)return;
  if(!isTrustedAppsScriptOrigin(event.origin))return;

  const data=event.data||{};

  if(data.type==='GUV_SECURITY_SESSION_GET'){
    postSessionToFrame(data.requestId);
    return;
  }

  if(data.type==='GUV_SECURITY_SESSION_SET'){
    savePortalSession(data.token,data.expiresAt);
    return;
  }

  if(data.type==='GUV_SECURITY_SESSION_CLEAR'){
    clearPortalSession();
    return;
  }

  if(data.type!=='GUV_SECURITY_USER')return;

  const educationId=String(data.educationId||'').trim();
  if(!educationId)return;
  currentEducationId=educationId;

  if(oneSignalApi){
    try{
      await oneSignalApi.login(currentEducationId);
      if('Notification' in window && Notification.permission!=='granted'){
        if(!isIOS()||isStandalone()){
          document.getElementById('pushBtn').style.display='block';
        }
      }
    }catch(error){
      console.error('OneSignal external_id login error:',error);
    }
  }
});

maybeShowIOSInstallTip();
</script>
</body>
</html>
