<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#092A5E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TBPG Güvenlik">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="manifest" href="/security/manifest.json?v=4018">
  <link rel="apple-touch-icon" href="/security/icon-192.png">
  <link rel="icon" href="/security/icon-192.png">
  <title>TUI BLUE Palm Garden Güvenlik Portalı</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f8fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #appFrame{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;background:#fff}

    .installFab{
      position:fixed;right:18px;bottom:18px;z-index:100002;display:none;align-items:center;gap:9px;
      border:0;border-radius:999px;padding:12px 16px;background:#092A5E;color:#fff;font-weight:900;
      font-size:13px;box-shadow:0 12px 28px rgba(9,42,94,.30);cursor:pointer
    }
    .installFab.show{display:flex}
    .installFab .ico{font-size:18px}
    .installSheet{
      position:fixed;inset:0;display:none;place-items:end center;background:rgba(0,24,40,.50);
      z-index:100003;padding:14px
    }
    .installSheet.show{display:grid}
    .installCard{
      width:min(480px,100%);background:#fff;border-radius:22px;padding:22px;color:#15344b;
      box-shadow:0 22px 70px rgba(0,0,0,.25)
    }
    .installCard h3{margin:0 0 10px;font-size:18px;color:#092A5E}
    .installCard p{margin:0 0 12px;font-size:13px;line-height:1.55;color:#607787}
    .steps{font-size:13px;line-height:1.65;margin:10px 0 16px}
    .closeBtn{width:100%;border:0;border-radius:13px;padding:12px;background:#eef4f8;color:#092A5E;font-weight:800}

    #pushBtn{
      position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:99999;
      border:0;border-radius:999px;padding:12px 16px;background:#00558E;color:#fff;font-weight:800;
      box-shadow:0 10px 28px rgba(0,59,106,.28);display:none
    }
    #installTip{
      position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
      z-index:100000;background:#fff;color:#17384c;border:1px solid #cfe0ea;border-radius:16px;
      padding:13px 42px 13px 14px;box-shadow:0 12px 34px rgba(0,59,106,.16);
      font-size:13px;line-height:1.45;display:none
    }
    #installTip b{color:#092A5E}
    #tipClose{position:absolute;right:8px;top:7px;width:30px;height:30px;border:0;border-radius:10px;background:#eef4f8;color:#31596e;font-size:19px}
    #status{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:100004;background:rgba(9,42,94,.96);color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:700;display:none;max-width:calc(100% - 24px);text-align:center}

    @media(display-mode:standalone){.installFab{display:none!important}}
  </style>
</head>
<body>
  <iframe id="appFrame" title="TUI BLUE Palm Garden Güvenlik Portalı"
    allow="clipboard-read; clipboard-write; camera; microphone; fullscreen" allowfullscreen></iframe>

  <button id="installFab" class="installFab" type="button">
    <span class="ico">⬇</span><span>Ana Ekrana Yükle</span>
  </button>

  <div id="installSheet" class="installSheet" role="dialog" aria-modal="true">
    <div class="installCard">
      <h3>Ana ekrana yükleyin</h3>
      <p>Güvenlik Portalı telefonunuzda uygulama gibi tam ekran açılabilir.</p>
      <div id="installSteps" class="steps"></div>
      <button id="closeInstallSheet" class="closeBtn" type="button">Kapat</button>
    </div>
  </div>

  <button id="pushBtn" type="button">🔔 Bildirimleri Aç</button>

  <div id="installTip">
    <button id="tipClose" type="button">×</button>
    <b>iPhone:</b> Safari’de Paylaş > <b>Ana Ekrana Ekle</b> seçeneğini kullanın.
  </div>

  <div id="status"></div>

<script>
(() => {
  'use strict';

  const APP_URL='https://script.google.com/macros/s/AKfycbx5GzuXdyc7W_OJNSzE6Mhshqvd6TmhuL580_NdwuCbSOIUVnw_QPVzrSTEDIvo6sf3Gg/exec';
  const ONESIGNAL_APP_ID='42b7220b-661b-45f3-907c-e54b9ea99aec';
  const SESSION_STORAGE_KEY='guv_security_portal_session_v4018';
  const DEVICE_KEY_STORAGE='guv_security_device_key_v4018';
  const SESSION_MAX_MS=14*24*60*60*1000;

  const frame=document.getElementById('appFrame');
  const pushBtn=document.getElementById('pushBtn');
  const installFab=document.getElementById('installFab');
  const installSheet=document.getElementById('installSheet');
  const installSteps=document.getElementById('installSteps');

  let deferredPrompt=null;
  let currentEducationId='';
  let oneSignalApi=null;

  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=()=>/android/i.test(navigator.userAgent);

  function showStatus(text,ms=2600){
    const e=document.getElementById('status');
    e.textContent=text;e.style.display='block';
    clearTimeout(showStatus.timer);
    showStatus.timer=setTimeout(()=>e.style.display='none',ms);
  }

  function randomDeviceKey(){
    try{
      if(crypto.randomUUID)return 'GUVDEV-'+crypto.randomUUID().replace(/-/g,'');
      const a=new Uint8Array(24);crypto.getRandomValues(a);
      return 'GUVDEV-'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){
      return 'GUVDEV-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
    }
  }

  function getDeviceKey(){
    let key='';
    try{key=localStorage.getItem(DEVICE_KEY_STORAGE)||''}catch(e){}
    if(!key){
      key=randomDeviceKey();
      try{localStorage.setItem(DEVICE_KEY_STORAGE,key)}catch(e){}
    }
    try{
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    }catch(e){}
    return key;
  }

  function readPortalSession(){
    try{
      const raw=localStorage.getItem(SESSION_STORAGE_KEY);
      if(!raw)return null;
      const box=JSON.parse(raw);
      const token=String(box?.token||'').trim();
      const expiresAt=Number(box?.expiresAt||0);
      if(!token||!expiresAt||expiresAt<=Date.now()){
        localStorage.removeItem(SESSION_STORAGE_KEY);
        return null;
      }
      return {token,expiresAt};
    }catch(e){return null}
  }

  function savePortalSession(token,expiresAt){
    token=String(token||'').trim();expiresAt=Number(expiresAt||0);
    if(!token)return;
    const maxExpiry=Date.now()+SESSION_MAX_MS;
    if(!expiresAt||expiresAt>maxExpiry)expiresAt=maxExpiry;
    if(expiresAt<=Date.now())return;
    try{localStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify({token,expiresAt,savedAt:Date.now()}))}catch(e){}
  }

  function clearPortalSession(){try{localStorage.removeItem(SESSION_STORAGE_KEY)}catch(e){}}

  function isTrustedAppsScriptOrigin(origin){
    origin=String(origin||'');
    return origin==='https://script.google.com' ||
      /^https:\/\/[a-z0-9.-]*script\.googleusercontent\.com$/i.test(origin);
  }

  // IMPORTANT: listener is attached BEFORE iframe src is assigned.
  window.addEventListener('message',async(event)=>{
    if(!frame||event.source!==frame.contentWindow)return;
    if(!isTrustedAppsScriptOrigin(event.origin))return;

    const data=event.data||{};

    if(data.type==='GUV_SECURITY_SESSION_GET'){
      const s=readPortalSession();
      frame.contentWindow.postMessage({
        type:'GUV_SECURITY_SESSION_RESPONSE',
        requestId:String(data.requestId||''),
        token:s?.token||'',
        expiresAt:s?.expiresAt||0,
        deviceKey:getDeviceKey()
      },'*');
      return;
    }

    if(data.type==='GUV_SECURITY_SESSION_SET'){
      savePortalSession(data.token,data.expiresAt);
      return;
    }

    if(data.type==='GUV_SECURITY_SESSION_CLEAR'){
      clearPortalSession();
      return;
    }

    if(data.type==='GUV_SECURITY_USER'){
      const id=String(data.educationId||'').trim();
      if(!id)return;
      currentEducationId=id;
      if(oneSignalApi){
        try{await oneSignalApi.login(currentEducationId)}catch(e){}
      }
    }
  });

  // PWA installability: Security now uses the same visible install approach as ISO/Dijital.
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('/security/OneSignalSDKWorker.js',{scope:'/security/'})
        .catch(err=>console.warn('Service worker kayıt hatası:',err));
    });
  }

  window.addEventListener('beforeinstallprompt',(e)=>{
    e.preventDefault();
    deferredPrompt=e;
    if(!isStandalone())installFab.classList.add('show');
  });

  // Android: if browser doesn't fire beforeinstallprompt immediately, still show
  // the button and provide manual menu instructions.
  if(!isStandalone() && (isAndroid()||isIOS())){
    setTimeout(()=>installFab.classList.add('show'),900);
  }

  installFab.addEventListener('click',async()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      const choice=await deferredPrompt.userChoice;
      if(choice.outcome==='accepted')installFab.classList.remove('show');
      deferredPrompt=null;
      return;
    }

    if(isIOS()){
      installSteps.innerHTML='<b>Safari</b> içinde:<br>1. Paylaş düğmesine dokunun.<br>2. <b>Ana Ekrana Ekle</b> seçeneğini seçin.<br>3. Sağ üstten <b>Ekle</b> deyin.';
    }else{
      installSteps.innerHTML='<b>Android / Chrome</b> içinde:<br>1. Sağ üstteki <b>⋮</b> menüsünü açın.<br>2. <b>Uygulamayı yükle</b> veya <b>Ana ekrana ekle</b> seçeneğini seçin.<br>3. <b>Yükle / Ekle</b> ile onaylayın.';
    }
    installSheet.classList.add('show');
  });

  document.getElementById('closeInstallSheet').addEventListener('click',()=>installSheet.classList.remove('show'));
  installSheet.addEventListener('click',e=>{if(e.target===installSheet)installSheet.classList.remove('show')});
  window.addEventListener('appinstalled',()=>{installFab.classList.remove('show');deferredPrompt=null});

  document.getElementById('tipClose').addEventListener('click',()=>{
    document.getElementById('installTip').style.display='none';
    try{localStorage.setItem('guv_install_tip_closed','1')}catch(e){}
  });
  if(isIOS()&&!isStandalone()&&localStorage.getItem('guv_install_tip_closed')!=='1'){
    document.getElementById('installTip').style.display='block';
  }

  window.OneSignalDeferred=window.OneSignalDeferred||[];
  window.OneSignalDeferred.push(async function(OneSignal){
    oneSignalApi=OneSignal;
    try{
      await OneSignal.init({
        appId:ONESIGNAL_APP_ID,
        serviceWorkerPath:'/security/OneSignalSDKWorker.js',
        serviceWorkerParam:{scope:'/security/'},
        autoResubscribe:true
      });
      if(currentEducationId)await OneSignal.login(currentEducationId);
    }catch(error){
      console.error('OneSignal init error:',error);
      showStatus('Bildirim sistemi başlatılamadı',3500);
      return;
    }

    const supported=('Notification' in window)&&('serviceWorker' in navigator);
    if(!supported){pushBtn.style.display='none';return}
    if(Notification.permission!=='granted'){
      if(!isIOS()||isStandalone())pushBtn.style.display='block';
    }

    pushBtn.addEventListener('click',async()=>{
      try{
        if(isIOS()&&!isStandalone()){
          document.getElementById('installTip').style.display='block';
          showStatus('Önce Ana Ekrana ekleyin');
          return;
        }
        if(currentEducationId)await OneSignal.login(currentEducationId);
        await OneSignal.Notifications.requestPermission();
        if(Notification.permission==='granted'){
          pushBtn.style.display='none';
          showStatus('Bildirimler açıldı ✓');
        }else showStatus('Bildirim izni verilmedi',3000);
      }catch(e){
        showStatus('Bildirim izni açılamadı',3500);
      }
    });
  });

  // Listener and storage are ready now; only then load Apps Script.
  getDeviceKey();
  frame.src=APP_URL + (APP_URL.includes('?')?'&':'?') + 'pwaBuild=4018&t=' + Date.now();
})();
</script>
</body>
</html>
