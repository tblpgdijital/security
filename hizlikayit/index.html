<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#092A5E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex,nofollow">
  <title>Hızlı Kayıt</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f8fc}
    iframe{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;background:#fff}
    #boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#f3f8fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#092A5E}
    #boot.hide{display:none}
    .bootbox{text-align:center;font-weight:850} .dot{width:34px;height:34px;margin:0 auto 12px;border:4px solid #d7e5ee;border-top-color:#092A5E;border-radius:50%;animation:s .75s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot"><div class="bootbox"><div class="dot"></div>Hızlı Kayıt<div style="font-size:11px;font-weight:600;opacity:.65;margin-top:5px">TUI BLUE Palm Garden</div></div></div>
  <iframe id="appFrame" title="Hızlı Kayıt" allow="clipboard-read; clipboard-write; camera; microphone; fullscreen" allowfullscreen></iframe>
<script>
(() => {
  'use strict';
  const APP_URL='https://script.google.com/macros/s/AKfycbx5GzuXdyc7W_OJNSzE6Mhshqvd6TmhuL580_NdwuCbSOIUVnw_QPVzrSTEDIvo6sf3Gg/exec';
  const SESSION_STORAGE_KEY='guv_security_portal_session_v4018';
  const DEVICE_KEY_STORAGE='guv_security_device_key_v4018';
  const SESSION_MAX_MS=14*24*60*60*1000;
  const frame=document.getElementById('appFrame');

  function randomDeviceKey(){
    try{
      if(crypto.randomUUID)return 'GUVDEV-'+crypto.randomUUID().replace(/-/g,'');
      const a=new Uint8Array(24);crypto.getRandomValues(a);
      return 'GUVDEV-'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){
      return 'GUVDEV-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
    }
  }
  function getDeviceKey(){
    let key='';
    try{key=localStorage.getItem(DEVICE_KEY_STORAGE)||''}catch(e){}
    if(!key){key=randomDeviceKey();try{localStorage.setItem(DEVICE_KEY_STORAGE,key)}catch(e){}}
    return key;
  }
  function readSession(){
    try{
      const raw=localStorage.getItem(SESSION_STORAGE_KEY);if(!raw)return null;
      const x=JSON.parse(raw),token=String(x?.token||''),expiresAt=Number(x?.expiresAt||0);
      if(!token||!expiresAt||expiresAt<=Date.now()){localStorage.removeItem(SESSION_STORAGE_KEY);return null}
      return {token,expiresAt};
    }catch(e){return null}
  }
  function saveSession(token,expiresAt){
    token=String(token||'').trim();expiresAt=Number(expiresAt||0);if(!token)return;
    const max=Date.now()+SESSION_MAX_MS;if(!expiresAt||expiresAt>max)expiresAt=max;
    if(expiresAt<=Date.now())return;
    try{localStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify({token,expiresAt,savedAt:Date.now()}))}catch(e){}
  }
  function clearSession(){try{localStorage.removeItem(SESSION_STORAGE_KEY)}catch(e){}}
  function trusted(origin){
    return origin==='https://script.google.com'||/^https:\/\/[a-z0-9.-]*script\.googleusercontent\.com$/i.test(String(origin||''));
  }

  // Listener iframe yüklenmeden önce hazır.
  window.addEventListener('message',event=>{
    if(event.source!==frame.contentWindow||!trusted(event.origin))return;
    const d=event.data||{};
    if(d.type==='GUV_SECURITY_SESSION_GET'){
      const s=readSession();
      frame.contentWindow.postMessage({
        type:'GUV_SECURITY_SESSION_RESPONSE',
        requestId:String(d.requestId||''),
        token:s?.token||'',
        expiresAt:s?.expiresAt||0,
        deviceKey:getDeviceKey()
      },'*');
    }else if(d.type==='GUV_SECURITY_SESSION_SET'){
      saveSession(d.token,d.expiresAt);
    }else if(d.type==='GUV_SECURITY_SESSION_CLEAR'){
      clearSession();
    }
  });

  frame.addEventListener('load',()=>setTimeout(()=>document.getElementById('boot').classList.add('hide'),120));
  getDeviceKey();
  frame.src=APP_URL+'?quick=hizlikayit&source=github-pwa&pwaBuild=4022&t='+Date.now();
})();
</script>
</body>
</html>
